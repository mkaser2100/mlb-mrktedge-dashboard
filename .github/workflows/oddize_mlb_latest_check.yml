name: Oddize MLB Props Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover MLB prop types and inspect raw payloads
        env:
          ODDIZE_API_KEY: ${{ secrets.ODDIZE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          BASE = "https://oddize.com/api/v1"
          key = os.environ.get("ODDIZE_API_KEY")
          if not key:
              raise SystemExit("FAIL: ODDIZE_API_KEY secret is missing")

          def get(path, params=None):
              q = urllib.parse.urlencode(params or {})
              url = f"{BASE}{path}" + (f"?{q}" if q else "")
              req = urllib.request.Request(url, headers={
                  "X-API-Key": key, "Accept": "application/json",
                  "User-Agent": "mlb-hit-lab-props-diagnostic/2.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode("utf-8")), {k.lower(): v for k, v in r.headers.items()}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"HTTP {e.code} for {url}: {body[:2000]}")
                  return None, {}

          print("=== 1. ODDIZE OFFER TYPES (FREE METADATA) ===")
          offers, h = get("/offer-types")
          print("Credits cost:", h.get("x-credits-cost"), "remaining:", h.get("x-credits-remaining"))
          print(json.dumps(offers, indent=2)[:30000])

          def walk(x):
              if isinstance(x, dict):
                  yield x
                  for v in x.values():
                      yield from walk(v)
              elif isinstance(x, list):
                  for v in x:
                      yield from walk(v)

          candidates, seen = [], set()
          for row in walk(offers):
              blob = json.dumps(row, default=str).lower()
              if "mlb" not in blob or not any(w in blob for w in ("hit","base","home run","strikeout","pitcher","batter")):
                  continue
              code = next((row.get(k) for k in ("code","offer_type","prop_type","key","id") if row.get(k) not in (None,"")), None)
              if code is not None and str(code) not in seen:
                  seen.add(str(code)); candidates.append(str(code))

          for code in ["batter_h","batter_hr","batter_tb","pitcher_k"]:
              if code not in seen:
                  candidates.append(code); seen.add(code)

          print("\n=== 2. PROP TYPES TO TEST ===")
          print(candidates)
          print("\n=== 3. RAW /props/mlb RESPONSES ===")
          for code in candidates:
              data, headers = get("/props/mlb", {"prop_type": code})
              print(f"\n##### prop_type={code} #####")
              print("Credits cost:", headers.get("x-credits-cost"), "remaining:", headers.get("x-credits-remaining"))
              if data is None:
                  continue
              if isinstance(data, dict):
                  print("Top-level keys:", list(data.keys()))
                  for k,v in data.items():
                      if isinstance(v, list):
                          print(f"{k}: {len(v)} rows")
                          for row in v[:3]:
                              print(json.dumps(row, indent=2)[:8000])
                      elif not isinstance(v,(dict,list)):
                          print(f"{k}: {v!r}")
              elif isinstance(data, list):
                  print("Top-level rows:", len(data))
                  for row in data[:3]:
                      print(json.dumps(row, indent=2)[:8000])
              else:
                  print(repr(data)[:8000])
          print("\n=== DIAGNOSTIC COMPLETE ===")
          PY
