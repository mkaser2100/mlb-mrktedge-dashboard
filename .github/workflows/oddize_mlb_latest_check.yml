name: Oddize MLB Latest Odds Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check current MLB odds in Oddize
        env:
          ODDIZE_API_KEY: ${{ secrets.ODDIZE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          BASE = "https://oddize.com/api/v1"
          key = os.environ.get("ODDIZE_API_KEY")
          if not key:
              raise SystemExit("FAIL: ODDIZE_API_KEY secret is missing")

          params = urllib.parse.urlencode({"sport": "mlb"})
          url = f"{BASE}/odds/latest?{params}"
          req = urllib.request.Request(
              url,
              headers={
                  "X-API-Key": key,
                  "Accept": "application/json",
                  "User-Agent": "mlb-hit-lab-latest-check/1.0",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode("utf-8")
                  headers = {k.lower(): v for k, v in r.headers.items()}
                  data = json.loads(body)
                  status = r.status
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              raise SystemExit(f"FAIL HTTP {e.code}: {body[:2000]}")

          print("=== ODDIZE CURRENT MLB ODDS ===")
          print("HTTP:", status)
          print("Credits cost:", headers.get("x-credits-cost"))
          print("Credits remaining:", headers.get("x-credits-remaining"))

          if isinstance(data, dict):
              print("Top-level keys:", list(data.keys()))
              for k, v in data.items():
                  if isinstance(v, list):
                      print(f"List field {k!r}: {len(v)} rows")
                      for i, row in enumerate(v[:10], 1):
                          print(f"--- {k} row {i} ---")
                          print(json.dumps(row, indent=2)[:6000])
                  elif isinstance(v, dict):
                      print(f"Object field {k!r}:")
                      print(json.dumps(v, indent=2)[:6000])
                  else:
                      print(f"{k}: {repr(v)[:1000]}")
          elif isinstance(data, list):
              print("Top-level rows:", len(data))
              for i, row in enumerate(data[:10], 1):
                  print(f"--- row {i} ---")
                  print(json.dumps(row, indent=2)[:6000])
          else:
              print("Unexpected response:", repr(data)[:3000])

          print("=== CHECK COMPLETE ===")
          PY
