name: Load MLB Market Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern game date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      bookmakers:
        description: "Fallback provider only: all US books, or comma-separated allowlist."
        required: false
        default: "all"
        type: string

# schedule:
#   Daily schedule intentionally remains disabled until Oddize is validated on a live MLB slate.
#   - cron: "0 14 * * *"

jobs:
  load-mlb-market-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDIZE_API_KEY: ${{ secrets.ODDIZE_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDS_REGIONS: us
      BOOKMAKERS: ${{ inputs.bookmakers || 'all' }}
      ODDS_TARGET_DATE: ${{ inputs.target_date || '' }}
      MAX_EVENTS_PER_RUN: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hit-prop-odds.txt

      - name: Verify configuration
        run: |
          echo "Primary provider: Oddize"
          echo "Fallback provider: The Odds API"
          echo "Target Date: ${ODDS_TARGET_DATE:-today Eastern}"
          echo "Fallback books: $BOOKMAKERS"
          echo "Oddize optimization: sport-level props; only model-required markets requested"

      - name: Compile loaders
        run: |
          python -m py_compile scripts/load_mlb_market_odds.py
          python -m py_compile scripts/load_mlb_market_odds_oddize.py

      - name: Load MLB market odds
        id: market_odds
        run: |
          set -euo pipefail
          python scripts/load_mlb_market_odds_oddize.py |& tee market-odds-loader.log

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MLB Market Odds Loader"
            echo
            echo "- Primary: **Oddize**"
            echo "- Fallback: **The Odds API**"
            echo "- Oddize is queried only for prop markets required by model predictions"
            echo "- Existing Supabase market tables/views remain unchanged"
            echo "- Existing The Odds API loader remains intact and is invoked automatically if Oddize fails validation"
            echo
            echo "### Provider usage / fallback status"
            echo '```'
            grep -E -A 6 "Oddize API usage:|Odds API usage:|FALLBACK ACTIVATED" market-odds-loader.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload loader log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-market-odds-loader-log-${{ github.run_id }}
          path: market-odds-loader.log
          if-no-files-found: ignore
