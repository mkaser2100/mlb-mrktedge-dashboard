name: Load MLB Market Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern game date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      bookmakers:
        description: "Use all US books, or provide a comma-separated bookmaker allowlist."
        required: false
        default: "all"
        type: string

# schedule:
#   Daily schedule intentionally remains disabled to protect the free API quota.
#   Re-enable only after reviewing observed credits/run in the job summary.
#   - cron: "0 14 * * *"

jobs:
  load-mlb-market-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      ODDS_REGIONS: us
      BOOKMAKERS: ${{ inputs.bookmakers || 'all' }}
      ODDS_TARGET_DATE: ${{ inputs.target_date || '' }}
      MAX_EVENTS_PER_RUN: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hit-prop-odds.txt

      - name: Verify configuration
        run: |
          echo "Provider: The Odds API"
          echo "Target Date: ${ODDS_TARGET_DATE:-today Eastern}"
          echo "Books: $BOOKMAKERS"
          echo "Max Events: $MAX_EVENTS_PER_RUN"
          echo "Optimization: prediction-aware markets + one event fetch + combined event odds"

      - name: Compile optimized loader
        run: python -m py_compile scripts/load_mlb_market_odds.py

      - name: Load MLB market odds
        id: market_odds
        run: |
          set -euo pipefail
          python scripts/load_mlb_market_odds.py | tee market-odds-loader.log

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MLB Market Odds Loader"
            echo
            echo "- Loader: \`scripts/load_mlb_market_odds.py\`"
            echo "- Event list fetched once"
            echo "- Only games with model predictions are queried"
            echo "- Only markets required by each game's predictions are queried"
            echo "- Batter + Pitcher-K markets share one event-odds request"
            echo "- Books: all US books by default; restricting books is optional, not treated as a quota-saving mechanism"
            echo
            echo "### Provider usage"
            echo '```'
            grep -A 8 "Odds API usage:" market-odds-loader.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload loader log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-market-odds-loader-log-${{ github.run_id }}
          path: market-odds-loader.log
          if-no-files-found: ignore
