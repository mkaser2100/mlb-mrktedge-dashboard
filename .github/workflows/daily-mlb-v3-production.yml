name: Daily MLB V3 Production Pipeline

on:
  workflow_dispatch:
    inputs:
      prediction_date:
        description: "Optional prediction date YYYY-MM-DD. Blank defaults to today ET."
        required: false
        type: string
      actuals_target_date:
        description: "Optional actuals date YYYY-MM-DD. Blank defaults to yesterday ET."
        required: false
        type: string

concurrency:
  group: daily-mlb-v3-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  phase1:
    uses: ./.github/workflows/load-all-mlb-phase-1.yml
    with:
      date: ${{ inputs.prediction_date || '' }}
      days_back: "7"
      skip_splits: false
    secrets: inherit

  statcast:
    needs: phase1
    uses: ./.github/workflows/load-mlb-statcast.yml
    with:
      dry_run: false
    secrets: inherit

  actuals:
    needs: phase1
    uses: ./.github/workflows/load-v3-hit-actuals.yml
    with:
      target_date: ${{ inputs.actuals_target_date || '' }}
      min_log_coverage_pct: "85"
    secrets: inherit

  power_actuals:
    name: Load HR + Total Bases actuals
    needs: phase1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ACTUALS_TARGET_DATE: ${{ inputs.actuals_target_date || '' }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Load and validate power-model actuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          requested = (os.getenv("ACTUALS_TARGET_DATE") or "").strip()
          target_date = requested or (
              datetime.now(ZoneInfo("America/New_York")).date()
              - timedelta(days=1)
          ).isoformat()

          targets = ["home_run_1plus", "total_bases_2plus"]

          print(f"Loading HR/TB actuals for: {target_date}")

          result = supabase.rpc(
              "sync_mlb_ml_batter_prediction_actuals",
              {"p_game_date": target_date},
          ).execute()

          print("sync_mlb_ml_batter_prediction_actuals result:")
          print(result.data)

          response = (
              supabase
              .table("mlb_ml_batter_predictions")
              .select(
                  "target_name,evaluation_status,actual_loaded,actual_value,game_pk"
              )
              .eq("game_date", target_date)
              .in_("target_name", targets)
              .range(0, 9999)
              .execute()
          )

          rows = response.data or []
          if not rows:
              print(
                  f"No HR/TB prediction cohort exists for {target_date}. "
                  "Skipping HR/TB actuals and scorecard validation for this date. "
                  "No retrospective predictions will be created."
              )
              raise SystemExit(0)

          counts = defaultdict(Counter)
          pending_game_pks = set()

          for row in rows:
              target = row.get("target_name")
              status = row.get("evaluation_status") or "unknown"
              counts[target]["total"] += 1
              counts[target][status] += 1

              if row.get("actual_loaded"):
                  counts[target]["actual_loaded"] += 1
              if row.get("actual_value") is not None:
                  counts[target]["actual_value_rows"] += 1

              if status not in ("evaluated", "dnp") and row.get("game_pk") is not None:
                  pending_game_pks.add(int(row["game_pk"]))

          # A prediction can legitimately remain pending if MLB moved the same
          # game_pk to a later date. Keep those rows pending so they can resolve
          # naturally after the rescheduled game is played.
          rescheduled_game_pks = set()

          if pending_game_pks:
              schedule_response = (
                  supabase
                  .table("v_mlb_all_scheduled_games_with_eligibility")
                  .select("game_pk,game_date,game_status")
                  .in_("game_pk", list(pending_game_pks))
                  .execute()
              )

              for game in schedule_response.data or []:
                  game_pk = game.get("game_pk")
                  current_game_date = str(game.get("game_date") or "")
                  if (
                      game_pk is not None
                      and current_game_date
                      and current_game_date > target_date
                  ):
                      rescheduled_game_pks.add(int(game_pk))

          print("Power actuals validation:")
          for target in targets:
              print(f"  {target}: {dict(counts[target])}")

          if rescheduled_game_pks:
              print(
                  "Legitimate postponed/rescheduled games excluded from "
                  f"completeness failure: {sorted(rescheduled_game_pks)}"
              )

          problems = []
          for target in targets:
              c = counts[target]
              if c["total"] <= 0:
                  problems.append(f"{target}: no prediction rows")
                  continue

              unresolved_rows = [
                  row
                  for row in rows
                  if row.get("target_name") == target
                  and (row.get("evaluation_status") or "unknown")
                      not in ("evaluated", "dnp")
              ]

              legitimate_pending = sum(
                  1
                  for row in unresolved_rows
                  if row.get("game_pk") is not None
                  and int(row["game_pk"]) in rescheduled_game_pks
              )

              unexpected_unresolved = len(unresolved_rows) - legitimate_pending

              if legitimate_pending > 0:
                  print(
                      f"  {target}: {legitimate_pending} pending rows belong "
                      "to postponed/rescheduled games and remain pending."
                  )

              if unexpected_unresolved > 0:
                  problems.append(
                      f"{target}: {unexpected_unresolved} unexpected unresolved rows "
                      f"(evaluated={c['evaluated']}, dnp={c['dnp']}, "
                      f"rescheduled_pending={legitimate_pending}, total={c['total']})"
                  )

              if c["evaluated"] > 0 and c["actual_value_rows"] < c["evaluated"]:
                  problems.append(
                      f"{target}: evaluated rows are missing actual_value "
                      f"({c['actual_value_rows']}/{c['evaluated']})"
                  )

          if problems:
              raise RuntimeError(
                  "Power-model actuals validation failed: "
                  + "; ".join(problems)
              )

          scorecard = (
              supabase
              .table("v_mlb_power_daily_scorecard")
              .select(
                  "target_name,game_date,model_run_id,model_version,"
                  "evaluated_rows,overall_success_rate,"
                  "top1_rate,top5_rate,top10_rate,top25_rate"
              )
              .eq("game_date", target_date)
              .in_("target_name", targets)
              .execute()
          )

          scorecard_rows = scorecard.data or []
          scorecard_targets = {
              row.get("target_name") for row in scorecard_rows
          }

          print("Power daily scorecard:")
          for row in scorecard_rows:
              print(f"  {row}")

          missing_scorecards = [
              target for target in targets
              if target not in scorecard_targets
          ]
          if missing_scorecards:
              raise RuntimeError(
                  f"Power actuals loaded but daily scorecard is missing "
                  f"{missing_scorecards} for {target_date}."
              )

          print(
              f"HR/TB actuals successfully closed for {target_date}; "
              "DNP rows remain excluded from evaluated performance, and "
              "postponed/rescheduled games remain pending until played."
          )
          PY

  pitcher_k_actuals:
    # Phase 4B: closes yesterday's shadow prediction -> actual loop.
    # Depend on Statcast as well so BF can be populated when available.
    needs: [phase1, statcast]
    uses: ./.github/workflows/load-mlb-pitcher-k-actuals.yml
    with:
      target_date: ${{ inputs.actuals_target_date || '' }}
      min_coverage_pct: "90"
    secrets: inherit

  features:
    needs: statcast
    uses: ./.github/workflows/refresh-mlb-v3-features.yml
    with:
      game_date: ${{ inputs.prediction_date || '' }}
    secrets: inherit

  v3_model:
    needs: [actuals, features]
    uses: ./.github/workflows/run-v3-hit-model-model.yml
    with:
      target_date: ${{ inputs.prediction_date || '' }}
    secrets: inherit

  pitcher_k_features:
    # Wait for v3_model because it publishes the game/start context
    # that Pitcher-K features depend on.
    needs: v3_model
    uses: ./.github/workflows/refresh-mlb-pitcher-k-features.yml
    with:
      game_date: ${{ inputs.prediction_date || '' }}
    secrets: inherit

  pitcher_k_shadow:
    # Phase 4 prospective shadow scoring: automatic runs must be pregame.
    needs: pitcher_k_features
    uses: ./.github/workflows/score-mlb-pitcher-k.yml
    with:
      game_date: ${{ inputs.prediction_date || '' }}
      allow_after_start: false
    secrets: inherit

  power_models:
    needs: features
    uses: ./.github/workflows/mlb-power-model-daily.yml
    with:
      run_date: ${{ inputs.prediction_date || '' }}
      target: all
      dry_run: false
      allow_after_start: false
    secrets: inherit

  performance:
    needs: [v3_model, power_models, power_actuals]
    uses: ./.github/workflows/refresh-mlb-hit-board-performance.yml
    with:
      days_back: "3"
    secrets: inherit
