name: Refresh MLB Pitcher K Features

on:
  workflow_call:
    inputs:
      game_date:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      game_date:
        description: "Pitcher K feature date in YYYY-MM-DD. Blank defaults to today ET."
        required: false
        type: string
      backfill:
        description: "Run historical backfill instead of daily refresh."
        required: false
        default: false
        type: boolean
      start_date:
        description: "Backfill start date YYYY-MM-DD."
        required: false
        type: string
      end_date:
        description: "Backfill end date YYYY-MM-DD."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-mlb-pitcher-k-features
  cancel-in-progress: false

jobs:
  refresh-pitcher-k-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
      PITCHER_K_FEATURE_MAX_ATTEMPTS: "8"
      PITCHER_K_FEATURE_RETRY_SECONDS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for eligible MLB games
        id: game_gate
        shell: bash
        env:
          INPUT_GAME_DATE: ${{ inputs.game_date }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          # Backfills intentionally operate over historical ranges and should
          # always continue into the existing backfill logic.
          if "${{ inputs.backfill || false }}" == "true":
              has_games = True
              run_date = "${{ inputs.game_date || 'backfill' }}"
          else:
              requested = "${{ inputs.game_date || '' }}".strip()
              run_date = requested or dt.datetime.now(
                  ZoneInfo("America/New_York")
              ).date().isoformat()

              params = urllib.parse.urlencode({
                  "select": "game_pk",
                  "game_date": f"eq.{run_date}",
                  "limit": "1",
              })
              url = (
                  os.environ["SUPABASE_URL"].rstrip("/")
                  + "/rest/v1/v_mlb_prediction_eligible_games?"
                  + params
              )
              key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
              request = urllib.request.Request(
                  url,
                  headers={
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  rows = json.loads(response.read().decode("utf-8"))
              has_games = bool(rows)

          print(
              f"Pitcher-K game gate | date={run_date} | "
              f"eligible_games={'yes' if has_games else 'no'}"
          )
          if not has_games:
              print(
                  f"No eligible MLB games for {run_date}; "
                  "Pitcher-K feature refresh is a successful no-op."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_games={'true' if has_games else 'false'}\n")
              fh.write(f"run_date={run_date}\n")
          PY

      - name: Refresh pitcher K features
        if: ${{ steps.game_gate.outputs.has_games == 'true' }}
        shell: bash
        env:
          INPUT_GAME_DATE: ${{ inputs.game_date }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail

          if [[ "${INPUT_BACKFILL:-false}" == "true" ]]; then
            if [[ -z "${INPUT_START_DATE:-}" || -z "${INPUT_END_DATE:-}" ]]; then
              echo "ERROR: backfill=true requires both start_date and end_date." >&2
              exit 1
            fi

            python scripts/refresh_pitcher_k_features.py \
              --backfill \
              --start-date "$INPUT_START_DATE" \
              --end-date "$INPUT_END_DATE"
          elif [[ -n "${INPUT_GAME_DATE:-}" ]]; then
            python scripts/refresh_pitcher_k_features.py --date "$INPUT_GAME_DATE"
          else
            python scripts/refresh_pitcher_k_features.py
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          SUMMARY_TRIGGER: ${{ github.event_name }}
          SUMMARY_GAME_DATE: ${{ inputs.game_date || 'today ET' }}
          SUMMARY_BACKFILL: ${{ inputs.backfill || false }}
        run: |
          {
            echo '## MLB Pitcher K Feature Refresh'
            echo
            printf '%s\n' "- Trigger: ${SUMMARY_TRIGGER}"
            printf '%s\n' "- Game date: ${SUMMARY_GAME_DATE}"
            printf '%s\n' "- Backfill: ${SUMMARY_BACKFILL}"
            echo '- Feature table: mlb_ml_pitcher_k_features_daily'
            echo '- Orchestration: master pipeline dependency'
            echo '- No-games guard: enabled; zero eligible games exit successfully'\n            echo '- Starter-context retry guard: enabled (8 attempts / 30 seconds when games are expected)'
            echo '- Post-refresh validation: enabled'
          } >> "$GITHUB_STEP_SUMMARY"
