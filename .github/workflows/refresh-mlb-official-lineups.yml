name: Refresh MLB Official Lineups

on:
  workflow_dispatch:
    # Roughly 10:15 AM-9:15 PM Eastern during EDT; script always uses ET date.
    # Removed the final 10:15 PM ET run because games are typically complete by then.
    - cron: "15 14-23 * * *"
    - cron: "15 0-1 * * *"
  workflow_dispatch:
    inputs:
      game_date:
        description: "YYYY-MM-DD; blank = today ET"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-mlb-official-lineups-${{ inputs.game_date || 'today' }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load confirmed MLB lineups
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          python scripts/load_mlb_official_lineups.py "${ARGS[@]}"

      - name: Refresh pitcher K features with confirmed-lineup overlay
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          python scripts/refresh_pitcher_k_features.py "${ARGS[@]}"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "scipy>=1.13,<2"

      - name: Score final confirmed-lineup predictions
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--prediction-stage final --confirmed-only --skip-started)
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          python scripts/score_pitcher_k.py "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## Pitcher K Phase 6" >> "$GITHUB_STEP_SUMMARY"
          echo "Loads MLB pregame batting orders, syncs confirmed starters, rebuilds matchup features, and stores a distinct final prediction snapshot." >> "$GITHUB_STEP_SUMMARY"
