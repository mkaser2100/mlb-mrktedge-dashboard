name: Oddize Connection Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Oddize authentication and MLB props
        env:
          ODDIZE_API_KEY: ${{ secrets.ODDIZE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          BASE = "https://oddize.com/api/v1"
          key = os.environ.get("ODDIZE_API_KEY")
          if not key:
              raise SystemExit("FAIL: ODDIZE_API_KEY secret is missing")

          def call(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "X-API-Key": key, "Accept": "application/json",
                  "User-Agent": "mlb-hit-lab-smoke-test/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read().decode("utf-8"))
                      headers = {k.lower(): v for k, v in r.headers.items()}
                      return r.status, headers, data
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"FAIL HTTP {e.code} for {path}: {body[:1000]}")

          def credit_headers(h):
              return {k: h.get(k) for k in
                      ("x-credits-cost","x-credits-remaining","x-ratelimit","x-cache")}

          print("=== 1. AUTH / ACCOUNT USAGE (FREE) ===")
          status,h,data=call("/account/usage")
          print("HTTP:",status)
          print("Headers:",json.dumps(credit_headers(h)))
          print("Body:",json.dumps(data,indent=2)[:3000])

          print("\n=== 2. OFFER TYPES (FREE) ===")
          status,h,data=call("/offer-types")
          print("HTTP:",status)
          print("Headers:",json.dumps(credit_headers(h)))
          print("Body sample:",json.dumps(data,indent=2)[:8000])

          print("\n=== 3. ONE MLB PROPS CALL (2 CREDITS) ===")
          status,h,data=call("/props/mlb",{"prop_type":"batter_h"})
          print("HTTP:",status)
          print("Headers:",json.dumps(credit_headers(h)))
          if isinstance(data,dict):
              print("Top-level keys:",list(data.keys()))
              for k,v in data.items():
                  if isinstance(v,list):
                      print(f"List field {k!r}: {len(v)} rows")
                      if v:
                          print("First row:",json.dumps(v[0],indent=2)[:5000])
                  elif isinstance(v,dict):
                      print(f"Object field {k!r} keys:",list(v.keys())[:50])
                  else:
                      print(f"Scalar field {k!r}:",repr(v)[:500])
          elif isinstance(data,list):
              print("Top-level list rows:",len(data))
              if data:
                  print("First row:",json.dumps(data[0],indent=2)[:5000])
          else:
              print("Unexpected response type:",type(data).__name__,repr(data)[:1000])
          print("\nSMOKE TEST COMPLETE")
          PY
