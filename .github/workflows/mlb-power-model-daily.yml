name: MLB Power Models - Daily Shadow Score

on:
  workflow_call:
    inputs:
      run_date:
        description: "Optional game date (YYYY-MM-DD). Blank = today in America/New_York"
        required: false
        type: string
        default: ""
      target:
        description: "Target to score"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Score without writing predictions"
        required: false
        type: boolean
        default: false
      allow_after_start:
        description: "Recovery only: allow scoring after today's games have started"
        required: false
        type: boolean
        default: false
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true

  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional game date (YYYY-MM-DD). Blank = today in America/New_York"
        required: false
        type: string
      target:
        description: "Target to score"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - home_run_1plus
          - total_bases_2plus
      dry_run:
        description: "Score without writing predictions"
        required: true
        default: false
        type: boolean
      allow_after_start:
        description: "Recovery only: allow scoring after today's games have started"
        required: true
        default: false
        type: boolean

  # PRIMARY TRIGGER: run as soon as the current-day V3 feature refresh finishes.
  # This removes GitHub cron latency from the critical path.
  workflow_run:
    workflows:
      - "Refresh MLB V3 Features"
    types: [completed]

  # REDUNDANT FALLBACKS.
  # During EDT these target 8:37 AM, 9:07 AM, and 9:37 AM Eastern.
  schedule:
    - cron: "37 12 * * *"
    - cron: "7 13 * * *"
    - cron: "37 13 * * *"

concurrency:
  group: mlb-power-model-daily-${{ inputs.run_date || 'today' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  score-power-models:
    name: Score HR + Total Bases shadow models
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Decide whether this run should score
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from supabase import create_client

          event_name = "${{ github.event_name }}"
          requested = "${{ inputs.run_date || '' }}".strip()
          run_date = requested or datetime.now(
              ZoneInfo("America/New_York")
          ).date().isoformat()

          # Manual runs are intentional and remain user-controlled.
          if event_name == "workflow_dispatch":
              should_run = True
              reason = "manual dispatch"
          else:
              supabase = create_client(
                  os.environ["SUPABASE_URL"],
                  os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              )

              # Refresh status if possible. A stale/missing status record must
              # not prevent a needed automatic recovery.
              try:
                  supabase.rpc(
                      "refresh_mlb_ml_batter_pipeline_status",
                      {"p_run_date": run_date},
                  ).execute()
              except Exception as exc:
                  print(f"Pipeline status refresh warning: {exc}")

              response = (
                  supabase.table("mlb_ml_batter_pipeline_status")
                  .select(
                      "target_name,status,expected_player_games,"
                      "prediction_rows,missing_prediction_rows"
                  )
                  .eq("run_date", run_date)
                  .in_(
                      "target_name",
                      ["home_run_1plus", "total_bases_2plus"],
                  )
                  .execute()
              )

              by_target = {
                  row["target_name"]: row
                  for row in (response.data or [])
              }

              def target_complete(target):
                  row = by_target.get(target) or {}
                  expected = int(row.get("expected_player_games") or 0)
                  predictions = int(row.get("prediction_rows") or 0)
                  missing = int(row.get("missing_prediction_rows") or 0)
                  return (
                      row.get("status") == "complete"
                      and expected > 0
                      and predictions == expected
                      and missing == 0
                  )

              already_complete = all(
                  target_complete(target)
                  for target in (
                      "home_run_1plus",
                      "total_bases_2plus",
                  )
              )

              should_run = not already_complete
              reason = (
                  "both targets already complete; protecting existing predictions"
                  if already_complete
                  else "automatic refresh required"
              )

              print("Current pipeline status:")
              for target in (
                  "home_run_1plus",
                  "total_bases_2plus",
              ):
                  print(f"  {target}: {by_target.get(target)}")

          print(
              f"Gate decision | event={event_name} | "
              f"date={run_date} | should_run={should_run} | reason={reason}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"run_date={run_date}\n")
          PY

      - name: Compile scorer
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: python -m py_compile scripts/score_mlb_power_models.py

      - name: Refresh and validate Phase 1 power features
        id: phase1
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from supabase import create_client

          run_date = "${{ steps.gate.outputs.run_date }}"
          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          max_attempts = 4
          sleep_seconds = 90
          last_problem = "not attempted"
          no_games = False

          for attempt in range(1, max_attempts + 1):
              print(
                  f"Phase 1 power feature attempt "
                  f"{attempt}/{max_attempts} for {run_date}"
              )

              try:
                  refresh = supabase.rpc(
                      "refresh_mlb_ml_batter_power_features",
                      {"p_game_date": run_date},
                  ).execute()
                  print("Power feature refresh result:")
                  print(refresh.data)

                  validation = (
                      supabase.table("mlb_ml_batter_power_features_daily")
                      .select(
                          "player_id,environment_point_in_time_safe,"
                          "environment_captured_at",
                          count="exact",
                      )
                      .eq("game_date", run_date)
                      .limit(1000)
                      .execute()
                  )

                  rows = validation.data or []
                  row_count = (
                      validation.count
                      if validation.count is not None
                      else len(rows)
                  )
                  missing_environment_rows = sum(
                      1
                      for row in rows
                      if row.get("environment_captured_at") is None
                  )
                  unsafe_environment_rows = sum(
                      1
                      for row in rows
                      if row.get("environment_captured_at") is not None
                      and row.get("environment_point_in_time_safe") is not True
                  )

                  coverage_response = supabase.rpc(
                      "validate_mlb_power_population_coverage",
                      {"p_run_date": run_date},
                  ).execute()
                  coverage = coverage_response.data or {}
                  if isinstance(coverage, list):
                      coverage = coverage[0] if coverage else {}

                  eligible_sides = int(
                      coverage.get("eligible_sides") or 0
                  )
                  represented_sides = int(
                      coverage.get("represented_sides") or 0
                  )
                  missing_sides = int(
                      coverage.get("missing_sides") or 0
                  )

                  print(
                      f"Validation | rows={row_count} "
                      f"missing_environment={missing_environment_rows} "
                      f"unsafe_environment={unsafe_environment_rows} "
                      f"eligible_sides={eligible_sides} "
                      f"represented_sides={represented_sides} "
                      f"missing_sides={missing_sides}"
                  )

                  # A true off-day is a valid no-op, not a pipeline failure.
                  # Requiring every population count to be zero prevents this
                  # guard from masking partial/missing feature coverage.
                  if (
                      row_count == 0
                      and eligible_sides == 0
                      and represented_sides == 0
                      and missing_sides == 0
                  ):
                      no_games = True
                      print(
                          f"No eligible MLB games for {run_date}; "
                          "Power Models will exit successfully without scoring."
                      )
                      break

                  if missing_environment_rows > 0:
                      print(
                          f"Info: {missing_environment_rows} feature rows have no "
                          "pregame environment snapshot. These rows may score with "
                          "missing/default environment handling; they are not marked safe."
                      )

                  if (
                      row_count > 0
                      and unsafe_environment_rows == 0
                      and eligible_sides > 0
                      and missing_sides == 0
                  ):
                      print(
                          f"Phase 1 power features are ready for {run_date}."
                      )
                      break

                  last_problem = (
                      f"rows={row_count}, "
                      f"missing_environment={missing_environment_rows}, "
                      f"unsafe_environment={unsafe_environment_rows}, "
                      f"eligible_sides={eligible_sides}, "
                      f"represented_sides={represented_sides}, "
                      f"missing_sides={missing_sides}"
                  )

              except Exception as exc:
                  last_problem = repr(exc)
                  print(f"Attempt {attempt} failed: {last_problem}")

              if attempt < max_attempts:
                  print(
                      f"Prerequisites are not ready yet; "
                      f"retrying in {sleep_seconds}s."
                  )
                  time.sleep(sleep_seconds)
              else:
                  raise RuntimeError(
                      f"Phase 1 power features were not ready after "
                      f"{max_attempts} attempts for {run_date}: {last_problem}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"no_games={'true' if no_games else 'false'}\n")
          PY

      - name: Score shadow models
        if: ${{ steps.gate.outputs.should_run == 'true' && steps.phase1.outputs.no_games != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()

          ARGS+=(--date "${{ steps.gate.outputs.run_date }}")
          ARGS+=(--target "${{ inputs.target || 'all' }}")

          if [[ "${{ inputs.dry_run || 'false' }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          # Automatic events are allowed to recover from GitHub scheduler /
          # runner latency. The database quality audit still records
          # prediction_not_pregame for any already-started game. The gate
          # above prevents a late fallback from overwriting a complete run.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            ARGS+=(--allow-after-start)
          elif [[ "${{ inputs.allow_after_start || 'false' }}" == "true" ]]; then
            ARGS+=(--allow-after-start)
          fi

          python scripts/score_mlb_power_models.py "${ARGS[@]}"

      - name: Refresh batter prediction board cache
        if: ${{ steps.gate.outputs.should_run == 'true' && steps.phase1.outputs.no_games != 'true' && inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          run_date = "${{ steps.gate.outputs.run_date }}"
          result = supabase.rpc(
              "refresh_mlb_batter_prediction_board_cache",
              {"p_run_date": run_date},
          ).execute()

          print("Batter prediction board cache refresh result:")
          print(result.data)

          if not result.data:
              raise RuntimeError(
                  "refresh_mlb_batter_prediction_board_cache returned no result"
              )
          PY

      - name: Validate HR and Total Bases cache freshness
        if: ${{ steps.gate.outputs.should_run == 'true' && steps.phase1.outputs.no_games != 'true' && inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          run_date = "${{ steps.gate.outputs.run_date }}"
          response = (
              supabase.table("mlb_batter_prediction_board_cache")
              .select("target_name,prediction_run_date,player_id")
              .eq("prediction_run_date", run_date)
              .in_(
                  "target_name",
                  ["home_run_1plus", "total_bases_2plus"],
              )
              .execute()
          )

          rows = response.data or []
          counts = {
              "home_run_1plus": 0,
              "total_bases_2plus": 0,
          }
          for row in rows:
              target = row.get("target_name")
              if target in counts:
                  counts[target] += 1

          print(f"Cache validation for {run_date}: {counts}")

          missing = [
              target
              for target, count in counts.items()
              if count == 0
          ]
          if missing:
              raise RuntimeError(
                  f"Cache freshness validation failed for {run_date}; "
                  f"missing targets: {missing}"
              )
          PY

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## MLB Power Model Daily"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Run date: \`${{ steps.gate.outputs.run_date || inputs.run_date || 'today ET' }}\`"
            echo "- Gate decision: \`${{ steps.gate.outputs.should_run || 'not evaluated' }}\`"
            echo "- No-games decision: \`${{ steps.phase1.outputs.no_games || 'not evaluated' }}\`"
            echo "- Primary dependency: \`Refresh MLB V3 Features\`"
            echo "- Existing-complete overwrite protection: \`enabled\`"
            echo "- Automatic late-recovery path: \`enabled and audited\`"
            echo "- No-games guard: \`enabled; zero population exits successfully\`"
            echo "- Phase 1 feature retries: \`4 x 90s when games are expected\`"
            echo "- Fallback schedules: \`12:37, 13:07, 13:37 UTC\`"
          } >> "$GITHUB_STEP_SUMMARY"
